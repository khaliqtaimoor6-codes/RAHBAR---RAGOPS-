<html><head><title>Cafeteria Timings</title></head><body><h1>Cafeteria Timings</h1><p>The main cafeteria is open from 8:00 to 18:00 on working days and from 9:00 to 14:00 on Saturdays. During the examination weeks it stays open until 20:00.</p><p>Students may not take crockery out of the cafeteria. Food is not allowed in the library or the computing labs.</p></body></html>
