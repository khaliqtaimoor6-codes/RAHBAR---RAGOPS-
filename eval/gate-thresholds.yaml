version: 1
# Release gate thresholds (Part C2 / F2). All metrics are the mean over a result's runs.
# Justification is in docs/RAGOPS.md -> Part C2. A rule is PASS only when every bound it
# declares holds; `required` defaults to true, so an unmeasured metric fails the gate.
#
# Module level: the embedding pin is shared by baseline and candidate, so module metrics
# should be effectively identical. A 0.02 drop in the paraphrase/gap score would mean the
# pin or the measurement changed; determinism must stay at 0 (float noise <= 0.001).
rules:
  - id: module-paraphrase
    level: module
    metric: paraphrase_mean_cosine
    max_drop: 0.02
  - id: module-gap
    level: module
    metric: gap
    max_drop: 0.02
  - id: module-determinism
    level: module
    metric: determinism_max_abs_diff
    max: 0.001

# Component level: two points of recall@5 is the paper's own gate (section 5.4 / A2's
# run_eval.py used five; C2 tightens it because the chunks and the collection both change).
# MRR/nDCG get three points, the typo sweep three, because seeded typos are noisier.
  - id: component-recall3
    level: component
    metric: recall@3
    max_drop: 0.05
  - id: component-recall5
    level: component
    metric: recall@5
    max_drop: 0.02
  - id: component-mrr
    level: component
    metric: mrr
    max_drop: 0.03
  - id: component-ndcg5
    level: component
    metric: ndcg@5
    max_drop: 0.03
  - id: component-typos-recall5
    level: component
    variant: typos
    metric: recall@5
    max_drop: 0.03
  - id: component-typos-mrr
    level: component
    variant: typos
    metric: mrr
    max_drop: 0.03

# End-to-end level: faithfulness >= 0.95 (no more than one unsupported answer in ~25
# judged) and no more than a five-point drop; abstention >= 0.83 (at most one of the six
# must-abstain questions answered, matching the Part B baseline); false abstention <= 0.12
# with at most a 0.05 rise (the two seeded runs already differed by 0.071); citation
# validity >= 0.98 and p95 <= 20 s (the api's per-call LLM timeout is 30 s).
  - id: e2e-faithfulness
    level: end_to_end
    metric: faithfulness
    min: 0.95
    max_drop: 0.05
  - id: e2e-abstention
    level: end_to_end
    metric: abstention_correct_unanswerable
    min: 0.83
  - id: e2e-false-abstention
    level: end_to_end
    metric: false_abstention_answerable
    max: 0.12
    max_rise: 0.05
  - id: e2e-citations
    level: end_to_end
    metric: citation_validity_in_retrieved
    min: 0.98
    max_drop: 0.02
  - id: e2e-latency-p95
    level: end_to_end
    metric: latency_p95_ms
    max: 20000
    max_rise_pct: 25
