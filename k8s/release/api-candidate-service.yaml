# F3: the candidate's own Service. The eval Job is pointed at http://api-candidate:8000;
# the Ingress never is, so a candidate can never take live traffic by accident.
apiVersion: v1
kind: Service
metadata:
  name: api-candidate
  namespace: rahbar
  labels: {app: api-candidate, app.kubernetes.io/part-of: rahbar}
spec:
  type: ClusterIP
  selector: {app: api-candidate}
  ports:
    - {name: http, port: 8000, targetPort: http}
