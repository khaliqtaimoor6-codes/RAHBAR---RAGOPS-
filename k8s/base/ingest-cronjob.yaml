# F2: the same ingestion re-runs on a schedule. With an unchanged corpus and an empty
# inbox it verifies nothing new and embeds 0 chunks (Part A2), so running it often is
# cheap. `kubectl create job --from=cronjob/ingest ...` is the manual trigger.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest
  namespace: rahbar
  labels: {app: indexer, app.kubernetes.io/part-of: rahbar}
spec:
  schedule: "0 3 * * *"            # every night at 03:00, cluster time
  concurrencyPolicy: Forbid        # never two writers at once (the lake also has a lock)
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels: {app: indexer, app.kubernetes.io/part-of: rahbar}
    spec:
      backoffLimit: 4
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels: {app: indexer, app.kubernetes.io/part-of: rahbar}
        spec:
          serviceAccountName: indexer
          enableServiceLinks: false
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: fetch-corpus
              image: rahbar-indexer
              imagePullPolicy: IfNotPresent
              command: ["python", "corpus/fetch.py", "--dest", "/data/lake/mirror"]
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 192Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - {name: lake, mountPath: /data/lake}
                - {name: tmp, mountPath: /tmp}
          containers:
            - name: ingest
              image: rahbar-indexer
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "pipeline.ingest"]
              args: []
              envFrom:
                - configMapRef: {name: rahbar-config}
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: "1500m"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - {name: lake, mountPath: /data/lake}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: lake
              persistentVolumeClaim: {claimName: rahbar-lake}
            - name: tmp
              emptyDir: {sizeLimit: 512Mi}
