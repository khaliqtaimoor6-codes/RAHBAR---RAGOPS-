# F2: ingestion with verification (Part A) as a Job: fetch -> verify -> update the data
# lake -> update the retrieval sources, then exit. It is the ONLY writer to the vector
# store: the api only reads (ADR 0001), the eval Job only queries the api, and the
# NetworkPolicy lets nothing but app=api and app=indexer reach chroma at all.
#
# Run it again by hand (same pod spec, from the CronJob):
#   kubectl -n rahbar create job --from=cronjob/ingest ingest-manual-$(date +%s)
# Feed it a new batch first: scripts/lake_upload.sh data/batch_b   (see k8s/README.md)
apiVersion: batch/v1
kind: Job
metadata:
  name: ingest
  namespace: rahbar
  labels: {app: indexer, app.kubernetes.io/part-of: rahbar}
spec:
  backoffLimit: 4                 # retries with exponential back-off, then the Job fails
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels: {app: indexer, app.kubernetes.io/part-of: rahbar}
    spec:
      serviceAccountName: indexer
      enableServiceLinks: false
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Download the public corpus listed in corpus/sources.yaml into the lake's mirror/
        # and check every SHA-256 against corpus/MANIFEST.md. Files already present with
        # the right hash are kept ("have"), so an unchanged corpus downloads nothing.
        - name: fetch-corpus
          image: rahbar-indexer
          imagePullPolicy: IfNotPresent
          command: ["python", "corpus/fetch.py", "--dest", "/data/lake/mirror"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - {name: lake, mountPath: /data/lake}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: ingest
          image: rahbar-indexer
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "pipeline.ingest"]
          args: []                      # ["--reconcile-only"] to rebuild from the lake only
          envFrom:
            - configMapRef: {name: rahbar-config}
          # Assignment 02 measured the OCR peak at 186Mi / 1411m (kubectl-top-indexer.txt).
          # Re-measured for the RAGOps Job in docs/RAGOPS.md (F5).
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1500m"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - {name: lake, mountPath: /data/lake}
            - {name: tmp, mountPath: /tmp}      # pdf2image and tesseract write here
      volumes:
        - name: lake
          persistentVolumeClaim: {claimName: rahbar-lake}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
